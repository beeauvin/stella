name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    # The compiler is written for macOS: it checks names as a filesystem that ignores case stores
    # them, and one test mounts a disk image.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the Rust that mise.toml pins, so CI builds with the toolchain the code is
      # written against.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.10.17
          install: true
          cache: true
      # The one command a person runs before they push. What it runs is in xtask/src/ci.rs.
      - run: mise run ci
