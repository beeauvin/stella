[package]
name = "stella-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "stella_cli"
path = "src/lib.rs"

[[bin]]
name = "stella"
path = "src/main.rs"

[dependencies]
stella-lexer = { path = "../lexer" }
stella-linter-text = { path = "../linter/text" }
stella-linter-tokens = { path = "../linter/tokens" }
